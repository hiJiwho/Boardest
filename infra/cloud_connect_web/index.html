<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boardest Cloud Connect — 전자칠판 안심 패스키 허브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'SiwonhanSeolreim';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2312-1@1.1/seolleimcool-SemiBold.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --bg: #070B14;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --teal: #00F5D4;
      --purple: #7F5AF0;
      --orange: #FF8906;
      --text: #FFFFFF;
      --text-sub: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'SiwonhanSeolreim', 'Noto Sans KR', sans-serif; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(127, 90, 240, 0.22) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 245, 212, 0.18) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      text-align: center;
    }
    .badge-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(0, 245, 212, 0.12);
      border: 1.5px solid rgba(0, 245, 212, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
    }
    h2 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
    p.desc { font-size: 13.5px; color: var(--text-sub); line-height: 1.5; margin-bottom: 24px; }
    .info-box {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 12.5px;
    }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: var(--text-sub); }
    .info-val { font-weight: 700; color: #FFF; }
    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--teal);
      color: #051014;
      box-shadow: 0 8px 20px rgba(0, 245, 212, 0.25);
    }
    .btn-primary:hover {
      background: #38EF7D;
      transform: translateY(-2px);
    }
    .btn-purple {
      background: var(--purple);
      color: #FFF;
      box-shadow: 0 8px 20px rgba(127, 90, 240, 0.3);
    }
    .btn-purple:hover {
      background: #9D7BFC;
      transform: translateY(-2px);
    }
    .status-msg {
      margin-top: 18px;
      font-size: 13px;
      color: var(--teal);
      font-weight: 700;
      min-height: 20px;
    }
    .security-note {
      margin-top: 24px;
      font-size: 11px;
      color: #64748B;
      line-height: 1.4;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge-icon" id="iconBadge">🔑</div>
    <h2 id="titleText">전자칠판 안심 로그인</h2>
    <p class="desc" id="descText">선생님의 스마트폰 생체인식(지문/FaceID)으로 칠판을 1초 만에 안전하게 잠금해제합니다.</p>

    <div class="info-box" id="infoBox">
      <div class="info-row">
        <span class="info-label">접속 학교 / 기기</span>
        <span class="info-val" id="targetInfo">확인 중...</span>
      </div>
      <div class="info-row">
        <span class="info-label">보안 검증</span>
        <span class="info-val" id="timerBadge" style="color: var(--teal);">2분 유효 챌린지</span>
      </div>
    </div>

    <button class="btn btn-primary" id="actionBtn" onclick="handleAuthAction()">
      <span>🔐 지문 / FaceID 로 승인하기</span>
    </button>

    <div class="status-msg" id="statusMsg"></div>

    <div class="security-note">
      🔒 <strong>Zero-Persistence 원칙</strong>: 이 사이트(Cloud-Connect) 및 로컬 스토리지에는 일체의 토큰이나 암호가 저장되지 않으며, 전자칠판 RAM으로만 안전하게 1회성 토큰이 전달됩니다.
    </div>
  </div>

  <script>
    if (window.location.pathname.startsWith('/edit')) {
      window.location.replace(`https://boardest-teacher-oauth.web.app/edit${window.location.search}`);
    }
    const RTDB_URL = "https://jiwhosboardest-default-rtdb.firebaseio.com";
    // 패스키 서버측 검증 / 토큰 발급 Worker (Google Client Secret 은 Worker 환경변수에만 존재)
    const WORKER_URL = "https://boardest-cloud-token.jiwho.workers.dev";
    const PROOF_SALT = "bst_passkey_v2_hmac_guard";
    const params = new URLSearchParams(window.location.search);
    if (params.has('create-Demo') || params.has('Demo') || params.has('demo')) {
      window.location.replace('https://boardest-teacher-oauth.web.app?create-Demo=1');
    }
    const key = params.get('key');
    const qrChallenge = params.get('c') || '';
    const bstPairParam = params.get('bst_pair') || params.get('pair');
    const school = params.get('school') || '학교 미지정';
    const device = params.get('device') || '전자칠판';
    const isRegister = params.get('action') === 'register' || params.get('register') === '1';

    // Reverse Pair Secret decode
    function unmanglePairSecret(mangled) {
      try {
        if (!mangled || !mangled.startsWith('BSTx!')) return null;
        let b64 = mangled.substring(5).replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4 !== 0) b64 += '=';
        const decoded = decodeURIComponent(escape(atob(b64)));
        if (!decoded.startsWith('BRK#') || !decoded.endsWith('#END')) return null;
        const payload = decoded.substring(4, decoded.length - 4);
        return payload.split('').reverse().join('');
      } catch (e) {
        return null;
      }
    }
    const reversePairSecret = bstPairParam ? unmanglePairSecret(bstPairParam) : null;

    // ── 이 스마트폰에 저장된 신원 정보 (이름 / 이메일 / 폴더만 저장 — 토큰은 저장하지 않음) ──
    let savedTeacherName = '';
    let savedEmail = '';
    let savedFolderId = '';
    let legacyToken = '';
    let legacyRefreshToken = '';
    try {
      savedTeacherName = localStorage.getItem('bst_teacher_name') || '';
      savedEmail = localStorage.getItem('bst_teacher_email') || '';
      savedFolderId = localStorage.getItem('bst_teacher_folder_id') || '';
      // 구버전이 저장해 둔 토큰은 1회 이전(패스키 등록 시 서버 보관)만 허용하고 즉시 폰에서 제거
      legacyToken = localStorage.getItem('bst_teacher_token') || '';
      legacyRefreshToken = localStorage.getItem('bst_teacher_refresh_token') || '';
      if (savedTeacherName === '이수학' || legacyToken.startsWith('demo_token')) {
        localStorage.removeItem('bst_teacher_name');
        savedTeacherName = '';
        legacyToken = '';
        legacyRefreshToken = '';
      }
      localStorage.removeItem('bst_teacher_token');
    } catch (_) {}

    const teacherName = params.get('teacherName') || params.get('teacher') || savedTeacherName || '선생님';
    const incomingToken = params.get('token') || params.get('accessToken') || legacyToken || '';
    const incomingEmail = params.get('email') || savedEmail || '';
    const incomingRefreshToken = params.get('refreshToken') || legacyRefreshToken || '';
    const incomingFolderId = params.get('folderId') || params.get('bstCloudFolderId') || savedFolderId || '';
    const timestampStr = params.get('t') || params.get('time') || '';
    const reqTimestamp = timestampStr ? parseInt(timestampStr, 10) : null;
    let isExpired = false;

    // 주소창/방문기록에 토큰이 남지 않도록 URL 에서 민감 파라미터 제거
    try {
      ['token', 'accessToken', 'refreshToken', 'totpSecret', 'totp'].forEach(k => params.delete(k));
      const qs = params.toString();
      window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : ''));
    } catch (_) {}

    // ── 유틸 ──
    function b64u(buf) {
      const bytes = new Uint8Array(buf);
      let s = '';
      for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function fromB64u(str) {
      let b64 = String(str).replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function sha256Hex(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function loginLink(label) {
      return `<a href="https://boardest-teacher-oauth.web.app?return_url=${encodeURIComponent(window.location.href)}" class="btn btn-purple" style="margin-top:12px;padding:12px 18px;text-decoration:none;display:inline-block;">${label}</a>`;
    }

    // Worker 호출 (오류 코드/메시지를 Error 로 변환)
    async function workerPost(path, body) {
      let res;
      try {
        res = await fetch(WORKER_URL + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {})
        });
      } catch (e) {
        throw new Error('인증 서버에 연결하지 못했습니다. 네트워크 상태를 확인해주세요.');
      }
      let json = {};
      try { json = await res.json(); } catch (_) {}
      if (!res.ok) {
        const err = new Error(json.error || ('서버 오류 (' + res.status + ')'));
        err.code = json.code || '';
        err.status = res.status;
        throw err;
      }
      return json;
    }

    function passkeySupported() {
      return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
    }

    function friendlyWebAuthnError(err) {
      if (err && (err.name === 'NotAllowedError' || err.name === 'AbortError')) {
        return new Error('생체인증(패스키) 확인이 취소되었거나 시간이 초과되었습니다. 다시 시도해주세요.');
      }
      if (err && err.name === 'InvalidStateError') {
        return new Error('이미 이 기기에 등록된 패스키입니다. 그대로 승인 QR을 사용하세요.');
      }
      if (err && err.name === 'SecurityError') {
        return new Error('이 주소(' + window.location.hostname + ')에서는 패스키를 사용할 수 없습니다. boardest-cloud-connect.web.app 로 접속해주세요.');
      }
      return err;
    }

    function deviceLabelGuess() {
      const ua = navigator.userAgent || '';
      if (/iPhone|iPad/.test(ua)) return 'iPhone/iPad';
      if (/Android/.test(ua)) return 'Android 스마트폰';
      if (/Windows/.test(ua)) return 'Windows PC';
      if (/Mac/.test(ua)) return 'Mac';
      return '교사 스마트폰';
    }

    // 만료된 access_token 대신 refresh_token 이 있으면 Worker 로 최신화 (Secret 은 서버에만 존재)
    async function freshAccessToken() {
      if (incomingRefreshToken) {
        try {
          const r = await workerPost('/api/auth/token/refresh', { refreshToken: incomingRefreshToken });
          if (r.accessToken) return r.accessToken;
        } catch (_) {}
      }
      return incomingToken;
    }

    // ── 패스키 등록: 서버(Worker)에 공개키 저장 — 실패 시 가짜 등록 없이 오류를 그대로 보여줌 ──
    async function registerPasskey(status) {
      if (!passkeySupported()) {
        throw new Error('이 브라우저는 패스키를 지원하지 않습니다. 최신 Chrome 또는 Safari 로 열어주세요.');
      }
      status.innerText = '교사 계정 확인 중...';
      const accessToken = await freshAccessToken();
      if (!accessToken) {
        const e = new Error('교사 Google 계정 로그인이 필요합니다.');
        e.code = 'UNAUTHENTICATED';
        throw e;
      }
      const opt = await workerPost('/api/passkey/register/options', { accessToken });

      status.innerText = '기기 생체인식 또는 화면 잠금 인증을 진행해주세요...';
      let cred;
      try {
        cred = await navigator.credentials.create({
          publicKey: {
            challenge: fromB64u(opt.challenge),
            rp: { id: opt.rpId, name: opt.rpName },
            user: { id: fromB64u(opt.user.id), name: opt.user.name, displayName: opt.user.displayName },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }], // ES256 (서버가 지원하는 알고리즘)
            authenticatorSelection: { residentKey: 'preferred', userVerification: 'required' },
            excludeCredentials: (opt.excludeCredentials || []).map(id => ({ type: 'public-key', id: fromB64u(id) })),
            attestation: 'none',
            timeout: 60000
          }
        });
      } catch (e) {
        throw friendlyWebAuthnError(e);
      }
      if (!cred) throw new Error('패스키 생성에 실패했습니다.');
      if (typeof cred.response.getPublicKey !== 'function') {
        throw new Error('브라우저가 패스키 공개키 추출을 지원하지 않습니다. 브라우저를 최신 버전으로 업데이트해주세요.');
      }
      const pub = cred.response.getPublicKey();
      const alg = typeof cred.response.getPublicKeyAlgorithm === 'function' ? cred.response.getPublicKeyAlgorithm() : -7;

      status.innerText = '패스키를 서버에 등록하는 중...';
      return await workerPost('/api/passkey/register/verify', {
        accessToken,
        challengeId: opt.challengeId,
        credentialId: b64u(cred.rawId),
        clientDataJSON: b64u(cred.response.clientDataJSON),
        publicKey: b64u(pub),
        publicKeyAlg: alg,
        refreshToken: incomingRefreshToken || '',
        folderId: incomingFolderId || '',
        label: deviceLabelGuess()
      });
    }

    // ── 패스키 로그인: 서버가 서명을 검증한 뒤에만 Drive access_token 이 발급됨 ──
    async function authenticateWithPasskey(email, status) {
      if (!passkeySupported()) {
        throw new Error('이 브라우저는 패스키를 지원하지 않습니다. 최신 Chrome 또는 Safari 로 열어주세요.');
      }
      if (!email) {
        const e = new Error('이 스마트폰에 등록된 교사 패스키 정보가 없습니다.');
        e.code = 'NO_PASSKEY';
        throw e;
      }
      const opt = await workerPost('/api/passkey/auth/options', { email });
      status.innerText = '생체인식 확인 중...';
      let assertion;
      try {
        assertion = await navigator.credentials.get({
          publicKey: {
            challenge: fromB64u(opt.challenge),
            rpId: opt.rpId,
            allowCredentials: (opt.allowCredentials || []).map(id => ({ type: 'public-key', id: fromB64u(id) })),
            userVerification: 'required',
            timeout: 60000
          }
        });
      } catch (e) {
        throw friendlyWebAuthnError(e);
      }
      if (!assertion) throw new Error('패스키 인증에 실패했습니다.');
      const r = assertion.response;
      status.innerText = '서버에서 패스키 서명을 검증하는 중...';
      return await workerPost('/api/passkey/auth/verify', {
        challengeId: opt.challengeId,
        credentialId: b64u(assertion.rawId),
        clientDataJSON: b64u(r.clientDataJSON),
        authenticatorData: b64u(r.authenticatorData),
        signature: b64u(r.signature)
      });
    }

    function noPasskeyHtml(msg) {
      return `${msg}<br>${loginLink('🔑 교사 계정 로그인 후 이 폰에 패스키 등록')}`;
    }

    function updateCountdown() {
      if (!reqTimestamp || isNaN(reqTimestamp)) return;
      const elapsed = Date.now() - reqTimestamp;
      const remainingSec = Math.max(0, Math.floor((120000 - elapsed) / 1000));
      const badge = document.getElementById('timerBadge');

      if (remainingSec > 0) {
        const m = Math.floor(remainingSec / 60);
        const s = (remainingSec % 60).toString().padStart(2, '0');
        if (badge) badge.innerText = `⏱️ 유효시간: ${m}:${s} 남음`;
      } else {
        isExpired = true;
        if (badge) {
          badge.innerText = `⚠️ 유효시간(2분) 만료됨`;
          badge.style.color = '#EF4565';
        }
        const btn = document.getElementById('actionBtn');
        if (btn) btn.disabled = true;
        const status = document.getElementById('statusMsg');
        if (status) {
          status.style.color = '#EF4565';
          status.innerHTML = '⚠️ <strong>유효시간(2분)이 만료된 세션입니다.</strong><br>전자칠판 또는 Teacher 앱에서 새 QR 코드를 생성한 뒤 다시 스캔해주세요.';
        }
      }
    }

    window.onload = function() {
      if (reqTimestamp) {
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }

      if (isExpired) return;

      const teacherDisplay = (savedTeacherName || teacherName !== '선생님') ? ` (${savedTeacherName || teacherName} 선생님)` : '';

      if (isRegister) {
        if (teacherName && teacherName !== '선생님') {
          try { localStorage.setItem('bst_teacher_name', teacherName); } catch(_) {}
        }
        document.getElementById('iconBadge').innerText = '🛡️';
        document.getElementById('titleText').innerText = '교사 패스키 등록';
        document.getElementById('descText').innerText = '이 스마트폰을 [' + teacherName + '] 선생님의 공인 패스키 인증 기기로 등록합니다.';
        document.getElementById('targetInfo').innerHTML = `${teacherName} <a href="#" onclick="localStorage.clear(); location.reload();" style="font-size:11px; color:#00F5D4; margin-left:8px; text-decoration:none;">(다른 계정)</a>`;
        document.getElementById('actionBtn').className = 'btn btn-purple';
        document.getElementById('actionBtn').innerHTML = '<span>📱 내 폰에 패스키 등록하기</span>';
      } else if (reversePairSecret) {
        document.getElementById('iconBadge').innerText = '☁️';
        document.getElementById('titleText').innerText = '전자칠판 교재·자료 클라우드 연결';
        document.getElementById('descText').innerText = '선생님의 수업자료 및 교재를 전자칠판에 안전하게 1회성으로 연결합니다.';
        document.getElementById('targetInfo').innerText = '전자칠판 확인 중...' + teacherDisplay;
        document.getElementById('actionBtn').className = 'btn btn-primary';
        document.getElementById('actionBtn').innerHTML = '<span>🚀 전자칠판에 내 클라우드 연결</span>';

        // 역방향 세션 정보 표시 (RTDB 1회 조회 — Firestore 읽기 0회)
        fetch(`${RTDB_URL}/cloud_pair_sessions/${reversePairSecret}.json`)
          .then(res => res.json())
          .then(data => {
            if (!data) return;
            const sc = data.schoolCode || '';
            const gr = data.grade || '';
            const cl = data.classNum || '';
            let loc = '전자칠판';
            if (gr && cl) loc = `${gr}학년 ${cl}반 전자칠판`;
            if (sc) loc = `${sc} ${loc}`;
            document.getElementById('targetInfo').innerText = loc + teacherDisplay;
          })
          .catch(() => {});
      } else if (key) {
        document.getElementById('targetInfo').innerText = school + ' · ' + device + teacherDisplay;
      } else {
        document.getElementById('descText').innerText = '전자칠판 화면의 QR 코드를 스마트폰 카메라로 비춰 접속하거나 아래 메뉴로 이동해주세요.';
        document.getElementById('actionBtn').style.display = 'none';
        document.getElementById('infoBox').style.display = 'none';
        document.getElementById('statusMsg').innerHTML = `
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
            <a href="https://boardest-teacher-oauth.web.app" class="btn btn-purple" style="text-decoration:none;">👩‍🏫 교사 통합 계정 로그인 · 패스키 설정</a>
            <a href="https://bcld.web.app" class="btn btn-primary" style="text-decoration:none;">☁️ Boardest Class Cloud (bcld) 열기</a>
          </div>
        `;
      }
    };

    // RTDB 에 JSON 쓰기 (성공 여부 반환)
    async function rtdbWrite(path, method, payload) {
      try {
        const res = await fetch(`${RTDB_URL}/${path}.json`, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return res.ok;
      } catch (_) {
        return false;
      }
    }

    function rememberIdentity(name, email, folderId) {
      try {
        if (name && name !== '선생님') localStorage.setItem('bst_teacher_name', name);
        if (email) localStorage.setItem('bst_teacher_email', email);
        if (folderId) localStorage.setItem('bst_teacher_folder_id', folderId);
      } catch (_) {}
    }

    async function handleAuthAction() {
      if (isExpired || (reqTimestamp && (Date.now() - reqTimestamp > 120000))) {
        alert("⚠️ 유효시간(2분)이 만료된 요청입니다. 새 QR 코드를 생성해주세요.");
        return;
      }

      const btn = document.getElementById('actionBtn');
      const status = document.getElementById('statusMsg');
      btn.disabled = true;
      status.style.color = '';

      // ── 1. 이 스마트폰을 교사 패스키 기기로 등록 ──
      if (isRegister) {
        try {
          const result = await registerPasskey(status);
          const email = result.email || incomingEmail;
          rememberIdentity(teacherName, email, incomingFolderId);
          try { localStorage.removeItem('bst_teacher_refresh_token'); } catch (_) {}

          // 교사 앱이 등록 완료를 감지할 수 있도록 비밀정보 없는 완료 표식만 기록
          if (key) {
            const marker = { status: 'registered', teacher: teacherName, registeredAt: Date.now() };
            await Promise.all([
              rtdbWrite(`passkey/sessions/${key}`, 'PUT', marker),
              rtdbWrite(`passkey_pairs/${key}`, 'PUT', marker)
            ]);
          }
          await rtdbWrite(`passkey_vaults/${encodeURIComponent(teacherName)}`, 'PUT', {
            credId: 'server_registered', teacherName: teacherName, registeredAt: Date.now()
          });

          status.innerHTML = "🎉 <strong>패스키 등록이 완료되었습니다!</strong><br>이제 전자칠판 QR 스캔 시 생체인증으로 안전하게 로그인됩니다.";
          btn.style.display = 'none';
        } catch (err) {
          status.style.color = '#EF4565';
          if (err.code === 'UNAUTHENTICATED') {
            status.innerHTML = noPasskeyHtml('등록 안내: 교사 Google 계정 로그인이 필요합니다.');
          } else {
            status.innerText = '등록 오류: ' + err.message;
          }
          btn.disabled = false;
        }
        return;
      }

      // ── 2. 전자칠판 로그인 승인 / 3. 전자칠판에 클라우드 연결 (둘 다 서버 검증된 패스키 필수) ──
      if (key || reversePairSecret) {
        try {
          const auth = await authenticateWithPasskey(incomingEmail, status);
          const accessToken = auth.accessToken;
          const teacherNameToSend = auth.teacherName || teacherName;
          const emailToSend = auth.email || incomingEmail;
          const folderIdToSend = auth.folderId || incomingFolderId || '';
          rememberIdentity(teacherNameToSend, emailToSend, folderIdToSend);

          if (key) {
            const proof = await sha256Hex(`${key}:${qrChallenge}:${accessToken}:${PROOF_SALT}`);
            const payload = {
              status: 'approved',
              teacher: teacherNameToSend,
              teacherName: teacherNameToSend,
              accessToken: accessToken,
              token: accessToken,
              folderId: folderIdToSend,
              bstCloudFolderId: folderIdToSend,
              email: emailToSend,
              schoolId: params.get('schoolId') || '',
              schoolName: school || '',
              proof: proof,
              timestamp: Date.now()
            };
            const [r1, r2] = await Promise.all([
              rtdbWrite(`passkey/sessions/${key}`, 'PUT', payload),
              rtdbWrite(`passkey_pairs/${key}`, 'PUT', payload)
            ]);
            if (r1 || r2) {
              status.innerText = "🚀 전자칠판 로그인 승인 완료! 칠판이 잠금해제되었습니다.";
              btn.style.display = 'none';
              setTimeout(() => { window.close(); }, 3000);
            } else {
              throw new Error("서버 전송 실패 (네트워크 연결을 확인해주세요)");
            }
          } else {
            status.innerText = "전자칠판에 클라우드 연결 전송 중...";
            const ok = await rtdbWrite(`cloud_pair_sessions/${reversePairSecret}`, 'PATCH', {
              status: 'authenticated',
              teacherName: teacherNameToSend || '선생님',
              email: emailToSend,
              accessToken: accessToken,
              folderId: folderIdToSend,
              bstCloudFolderId: folderIdToSend
            });
            if (ok) {
              status.innerHTML = "🎉 <strong>전자칠판에 클라우드가 연결되었습니다!</strong><br>칠판 화면이 내 수업 자료로 즉시 전환됩니다.";
              btn.style.display = 'none';
              setTimeout(() => { window.close(); }, 3000);
            } else {
              throw new Error("클라우드 세션 전송에 실패했습니다. 새 QR 코드로 다시 시도해주세요.");
            }
          }
        } catch (err) {
          status.style.color = '#EF4565';
          if (err.code === 'NO_PASSKEY' || err.code === 'UNKNOWN_CREDENTIAL') {
            status.innerHTML = noPasskeyHtml('이 계정으로 등록된 패스키가 없습니다.');
          } else if (err.code === 'NO_REFRESH_TOKEN' || err.code === 'GOOGLE_REFRESH_FAILED') {
            status.innerHTML = noPasskeyHtml(err.message);
          } else {
            status.innerText = (key ? '승인 안내: ' : '연결 오류: ') + err.message;
          }
          btn.disabled = false;
        }
      }
    }
  </script>
