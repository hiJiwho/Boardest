<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Boardest 실시간 급식 지도 & 반별 호출</title>
  
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0F0E17;
      --card-bg: #16161A;
      --card-border: #242629;
      --accent-teal: #00F5D4;
      --accent-teal-soft: rgba(0, 245, 212, 0.15);
      --accent-orange: #FF8906;
      --accent-orange-soft: rgba(255, 137, 6, 0.15);
      --accent-purple: #7F5AF0;
      --accent-purple-soft: rgba(127, 90, 240, 0.2);
      --danger: #FF5470;
      --danger-soft: rgba(255, 84, 112, 0.15);
      --text: #FFFFFE;
      --text-sub: #94A1B2;
      --text-muted: #72757E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top AppBar (Matches Boardest Teacher AppBar) */
    header {
      background-color: #16161A;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .appbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .appbar-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
    }

    .appbar-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .appbar-icon {
      color: var(--accent-orange);
      font-size: 20px;
    }

    .appbar-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .appbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-appbar-icon {
      background: transparent;
      border: none;
      color: var(--accent-orange);
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-appbar-icon:hover {
      background: rgba(255, 137, 6, 0.1);
    }

    .time-badge {
      font-family: 'Outfit', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-orange);
      background: var(--accent-orange-soft);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 137, 6, 0.3);
    }

    /* Main Container (Max 860px like MealView constrained box) */
    main {
      flex: 1;
      padding: 20px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Section Card */
    .section-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      padding: 18px;
      transition: border-color 0.2s;
    }

    /* Section 1: Cafeteria Choice Chips */
    .section-1-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
    }

    .section-subinfo {
      font-size: 11.5px;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .section-subinfo:hover {
      color: var(--accent-teal);
      text-decoration: underline;
    }

    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      background: #0F0E17;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease-in-out;
    }

    .chip-btn:hover {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .chip-btn.active-all {
      background: var(--accent-teal);
      color: #000;
      font-weight: 700;
      border-color: var(--accent-teal);
    }

    .chip-btn.active-caf {
      background: var(--accent-orange);
      color: #000;
      font-weight: 700;
      border-color: var(--accent-orange);
    }

    /* Section 2: Online Classrooms List */
    .section-2 {
      border-color: rgba(0, 245, 212, 0.3);
    }

    .section-2-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-teal);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px var(--accent-teal);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }

    .btn-call-all {
      background-color: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-call-all:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-call-all:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .classroom-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .classroom-item {
      background: #0F0E17;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s;
    }

    .classroom-item.is-calling-item {
      border-color: rgba(255, 137, 6, 0.4);
      background: rgba(255, 137, 6, 0.05);
    }

    .classroom-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .classroom-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .classroom-name {
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
    }

    .classroom-tag {
      font-size: 10.5px;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .classroom-status {
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-calling {
      color: var(--accent-orange);
      font-weight: 700;
    }

    .status-online {
      color: var(--accent-teal);
      font-weight: 500;
    }

    .classroom-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-item-call {
      background: var(--accent-teal);
      color: #000;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .btn-item-call:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-item-cancel {
      background: var(--danger-soft);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .btn-item-cancel:hover {
      background: rgba(255, 84, 112, 0.25);
    }

    /* Section 3: Today's Neis Meal Menu Card */
    .section-3 {
      border-color: rgba(255, 137, 6, 0.3);
    }

    .meal-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .meal-dish-chip {
      background: #0F0E17;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.6;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: #16161A;
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 26px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }

    .modal-desc {
      font-size: 12.5px;
      color: var(--text-sub);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .input-label {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      display: block;
    }

    .input-label span {
      font-weight: normal;
      color: var(--text-sub);
      font-size: 11px;
    }

    .input-field {
      width: 100%;
      background: #0F0E17;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent-teal);
    }

    .cafeteria-select-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    .caf-select-btn {
      background: #0F0E17;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .caf-select-btn.selected {
      background: var(--accent-orange);
      color: #000;
      font-weight: 700;
      border-color: var(--accent-orange);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-teal), #00bbf9);
      border: none;
      color: #000;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(0, 245, 212, 0.25);
    }

    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #16161A;
      border: 1px solid var(--accent-teal);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 1100;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 600px) {
      main {
        padding: 14px;
      }
      .appbar-title {
        font-size: 14.5px;
      }
    }
  </style>
</head>
<body>

  <!-- Top AppBar -->
  <header>
    <div class="appbar-left">
      <img src="logo.png" alt="Boardest Logo" class="appbar-logo" onerror="this.style.display='none'" />
      <div class="appbar-title-wrap">
        <span class="appbar-icon">🍱</span>
        <h1 class="appbar-title">Boardest 실시간 급식 지도 & 반별 호출</h1>
      </div>
    </div>
    <div class="appbar-right">
      <div class="time-badge" id="liveClock">00:00</div>
      <button class="btn-appbar-icon" onclick="fetchData()" title="새로고침">🔄</button>
      <button class="btn-appbar-icon" onclick="openEntryModal(false)" title="학교 및 급식실 변경">⚙️</button>
    </div>
  </header>

  <main>
    <!-- Section 1: Cafeteria & Teacher Info Bar -->
    <div class="section-card">
      <div class="section-1-header">
        <div class="section-title">
          <span style="color: var(--accent-orange); font-size: 16px;">🚪</span>
          <span>급식실 선택 (1~9급식실)</span>
        </div>
        <div class="section-subinfo" id="headerSubInfo" onclick="openEntryModal(false)">
          <span id="subInfoSchool">접속 대기 중</span> · <span id="subInfoTeacher">-</span> 선생님
          <span style="font-size: 10px; opacity: 0.8;">✏️</span>
        </div>
      </div>

      <div class="chips-wrap" id="cafeteriaChipsContainer">
        <!-- Choice chips 1~9 rendered dynamically -->
      </div>
    </div>

    <!-- Section 2: Realtime Online Classrooms & Call Buttons -->
    <div class="section-card section-2">
      <div class="section-2-header">
        <div class="section-title">
          <span class="status-dot"></span>
          <span id="classroomSectionTitle">실시간 온라인 교실 (접속 대기 중)</span>
        </div>
        <button class="btn-call-all" id="btnCallAll" onclick="callAllFilteredClassrooms()">
          <span>📢</span>
          <span>전체 동시 호출</span>
        </button>
      </div>

      <div class="classroom-list" id="classroomList">
        <div class="empty-state">학교 ID와 급식실을 확인하고 온라인 학급을 조회합니다.</div>
      </div>
    </div>

    <!-- Section 3: Today's Neis Meal Menu Card -->
    <div class="section-card section-3">
      <div class="section-title">
        <span style="color: var(--accent-orange); font-size: 18px;">🍽️</span>
        <span id="mealDateTitle">오늘의 급식 식단</span>
      </div>
      <div class="meal-chips-wrap" id="mealChipsContainer">
        <div class="meal-dish-chip">급식 데이터를 불러오는 중...</div>
      </div>
    </div>
  </main>

  <!-- Prompt Modal: Unconditionally shown on visit -->
  <div class="modal-backdrop" id="entryModal">
    <div class="modal-box">
      <div class="modal-header">
        <span style="font-size: 24px;">🍱</span>
        <h3 class="modal-title">Boardest Eat 급식 지도 접속</h3>
      </div>
      <p class="modal-desc">
        급식 지도 시스템 접속을 위해 학교 ID, 담당 급식실, 교사명을 확인해 주세요.
      </p>
      
      <label class="input-label">학교 ID (코드) <span>*쿼리스트링 가능 (?schoolId=...)</span></label>
      <input type="text" id="modalSchoolCode" class="input-field" placeholder="학교 접속 ID를 입력하세요" />

      <label class="input-label">담당 급식실 <span>*쿼리스트링 가능 (?cafeteria=...)</span></label>
      <div class="cafeteria-select-grid" id="modalCafGrid">
        <!-- 1~9 buttons -->
      </div>

      <label class="input-label">교사명 <span>*첫 기입 시 브라우저에 자동 저장됩니다</span></label>
      <input type="text" id="modalCallerName" class="input-field" placeholder="예: 김선생님 (또는 급식지도교사)" />

      <button type="button" class="btn-submit" onclick="submitEntry()">급식 지도 시작 ➔</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span id="toastIcon">🔔</span>
    <span id="toastMsg">작업이 완료되었습니다.</span>
  </div>

  <script>
    // ─── Constants ───
    const NEIS_KEY = '821179541cf54b6288d51741f30e1c90';
    const FIRESTORE_BASE = 'https://firestore.googleapis.com/v1/projects/jiwhosboardest/databases/(default)/documents';

    // Parse URL Query Strings (Supports schoolId, schoolCode, cafeteria, caf, callerName, teacherName)
    const urlParams = new URLSearchParams(window.location.search);
    const qsSchool = (urlParams.get('schoolId') || urlParams.get('schoolCode') || urlParams.get('school') || '').trim().toLowerCase();
    const qsCafeteria = (urlParams.get('cafeteria') || urlParams.get('caf') || urlParams.get('cafNum') || '').trim();
    const qsCaller = (urlParams.get('callerName') || urlParams.get('teacherName') || urlParams.get('teacher') || urlParams.get('name') || '').trim();

    // Active session variables (School & Cafeteria are NOT saved to localStorage, only Teacher Name is saved)
    let schoolCode = qsSchool || '';
    let selectedCafeteria = (qsCafeteria && ['1','2','3','4','5','6','7','8','9','all'].includes(qsCafeteria)) ? qsCafeteria : '1';
    let callerName = qsCaller || localStorage.getItem('bst_eat_saved_teacher') || '';
    let schoolName = '';

    // Runtime state
    let onlineClassrooms = [];
    let calledRooms = new Set();
    let audioCtx = null;

    function playChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (_) {}
    }

    // Live clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveClock').innerText = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ─── Entry Modal Setup (무조건 질문 & 교사명만 첫 기입 시 저장) ───
    let modalSelectedCaf = selectedCafeteria;

    function renderModalCafGrid() {
      const grid = document.getElementById('modalCafGrid');
      let html = '';
      for (let i = 1; i <= 9; i++) {
        const numStr = String(i);
        const isSel = (modalSelectedCaf === numStr);
        html += `<div class="caf-select-btn ${isSel ? 'selected' : ''}" onclick="selectModalCaf('${numStr}')">${numStr}급식실</div>`;
      }
      const isAll = (modalSelectedCaf === 'all');
      html += `<div class="caf-select-btn ${isAll ? 'selected' : ''}" onclick="selectModalCaf('all')">전체</div>`;
      grid.innerHTML = html;
    }

    function selectModalCaf(caf) {
      modalSelectedCaf = caf;
      renderModalCafGrid();
    }

    function openEntryModal(force) {
      document.getElementById('modalSchoolCode').value = schoolCode;
      modalSelectedCaf = selectedCafeteria;
      renderModalCafGrid();

      // 교사명: 저장된 값이 있으면 자동 채움
      const savedTeacher = localStorage.getItem('bst_eat_saved_teacher') || callerName;
      document.getElementById('modalCallerName').value = savedTeacher;

      document.getElementById('entryModal').style.display = 'flex';
    }

    function submitEntry() {
      const sCode = document.getElementById('modalSchoolCode').value.trim().toLowerCase();
      const cName = document.getElementById('modalCallerName').value.trim();

      if (!sCode) {
        alert('학교 ID(코드)를 입력해 주세요.');
        return;
      }
      if (!cName) {
        alert('교사명을 입력해 주세요. (예: 김선생님)');
        return;
      }

      schoolCode = sCode;
      selectedCafeteria = modalSelectedCaf || '1';
      callerName = cName;

      // ★ 요구사항 준수: 오직 교사명만 localStorage에 저장 (학교 ID와 급식실은 영구 저장하지 않음)
      localStorage.setItem('bst_eat_saved_teacher', callerName);

      document.getElementById('entryModal').style.display = 'none';

      // 쿼리스트링 동기화
      const p = new URLSearchParams(window.location.search);
      p.set('schoolId', schoolCode);
      p.set('cafeteria', selectedCafeteria);
      window.history.replaceState(null, '', window.location.pathname + '?' + p.toString());

      updateHeaderInfo();
      fetchData();
      loadNeisMealMenu();
      showToast(`🍱 ${callerName} 선생님으로 접속되었습니다.`);
    }

    // ─── Header & Cafeteria Chips ───
    function updateHeaderInfo() {
      const dispSchool = schoolName || (schoolCode ? schoolCode.toUpperCase() : '급식실');
      document.getElementById('subInfoSchool').innerText = dispSchool;
      document.getElementById('subInfoTeacher').innerText = callerName || '-';

      const now = new Date();
      document.getElementById('mealDateTitle').innerText = `${now.getMonth() + 1}월 ${now.getDate()}일 급식 식단 (${dispSchool})`;
    }

    function renderCafeteriaChips() {
      const container = document.getElementById('cafeteriaChipsContainer');
      const totalOnline = onlineClassrooms.length;

      let html = `
        <button class="chip-btn ${selectedCafeteria === 'all' ? 'active-all' : ''}" onclick="setCafeteria('all')">
          전체 학급 (${totalOnline})
        </button>
      `;

      for (let i = 1; i <= 9; i++) {
        const numStr = String(i);
        const count = onlineClassrooms.filter(c => String(c.cafeteria) === numStr).length;
        const isSelected = selectedCafeteria === numStr;
        const countLabel = count > 0 ? ` (${count})` : '';
        html += `
          <button class="chip-btn ${isSelected ? 'active-caf' : ''}" onclick="setCafeteria('${numStr}')">
            ${numStr}급식실${countLabel}
          </button>
        `;
      }
      container.innerHTML = html;
    }

    function setCafeteria(caf) {
      selectedCafeteria = caf;
      const p = new URLSearchParams(window.location.search);
      p.set('schoolId', schoolCode);
      p.set('cafeteria', selectedCafeteria);
      window.history.replaceState(null, '', window.location.pathname + '?' + p.toString());

      renderCafeteriaChips();
      renderClassrooms();
    }

    // ─── Classroom Rendering (온라인인 학급만 엄격 렌더링) ───
    function renderClassrooms() {
      const container = document.getElementById('classroomList');
      const filtered = onlineClassrooms.filter(c => {
        if (!c.isOnline) return false; // ★ 온라인이 아닌 학급 제외
        if (selectedCafeteria === 'all') return true;
        return String(c.cafeteria) === String(selectedCafeteria);
      });

      const titleEl = document.getElementById('classroomSectionTitle');
      titleEl.innerText = `실시간 온라인 교실 (${selectedCafeteria === 'all' ? '전체' : selectedCafeteria + '급식실 전용'}: ${filtered.length}개 학급)`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            현재 ${selectedCafeteria === 'all' ? '전체' : selectedCafeteria + '급식실에'} 온라인 접속된 전자칠판 학급이 없습니다.<br>
            <span style="font-size: 11.5px; opacity: 0.7;">(전자칠판에서 앱이 구동되면 실시간으로 나타납니다)</span>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(room => {
        const isCalled = calledRooms.has(room.docId);
        html += `
          <div class="classroom-item ${isCalled ? 'is-calling-item' : ''}">
            <div class="classroom-info">
              <div class="classroom-name-row">
                <span class="classroom-name">${room.grade}학년 ${room.classNum}반</span>
                <span class="classroom-tag">${room.cafeteria}급식실</span>
              </div>
              <div class="classroom-status">
                ${isCalled 
                  ? '<span class="status-calling">🔔 급식실 이동 호출 팝업 표시 중</span>' 
                  : '<span class="status-online">🟢 온라인 대기 중</span>'
                }
              </div>
            </div>
            <div class="classroom-actions">
              ${isCalled ? `
                <button class="btn-item-cancel" onclick="cancelCall('${room.docId}')">
                  <span>❌</span>
                  <span>호출 취소</span>
                </button>
              ` : `
                <button class="btn-item-call" onclick="sendCall('${room.docId}', '${room.grade}', '${room.classNum}')">
                  <span>🔔</span>
                  <span>급식 호출</span>
                </button>
              `}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // ─── Realtime Presence Polling (온라인 엄격 판정 + 시계 오차 허용 + Firestore fallback) ───
    async function fetchData() {
      if (!schoolCode) return;

      let rawList = [];
      try {
        const workerUrl = `https://boardest-cloud-token.jiwho.workers.dev/api/classrooms?schoolCode=${encodeURIComponent(schoolCode)}`;
        const res = await fetch(workerUrl, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          rawList = data.classrooms || [];
        }
      } catch (e) {
        console.warn('Worker presence lookup error:', e);
      }

      // Worker에 데이터가 없거나 실패한 경우, Firestore eat_calls 컬렉션 직접 조회 (안전망)
      if (!rawList || rawList.length === 0) {
        try {
          const fsRes = await fetch(`${FIRESTORE_BASE}/eat_calls?pageSize=100`, { cache: 'no-store' });
          if (fsRes.ok) {
            const fsData = await fsRes.json();
            const docs = fsData.documents || [];
            rawList = [];
            docs.forEach(d => {
              const f = d.fields || {};
              const docSchoolCode = (f.schoolCode?.stringValue || '').trim().toLowerCase();
              const docName = d.name ? d.name.split('/').pop() : '';
              if (docSchoolCode === schoolCode || docName.startsWith(schoolCode + '_')) {
                const isCalled = f.called?.booleanValue || false;
                rawList.push({
                  docId: docName,
                  schoolCode: docSchoolCode,
                  schoolName: f.schoolName?.stringValue || '',
                  cafeteria: f.cafeteriaNum?.stringValue || '1',
                  grade: f.grade?.integerValue || (docName.split('_')[2] || '1'),
                  classNum: f.classNum?.integerValue || (docName.split('_')[3] || '1'),
                  nickname: f.classNickname?.stringValue || '',
                  lastActive: f.lastActive?.timestampValue || null,
                  called: isCalled
                });
              }
            });
          }
        } catch (fe) {
          console.warn('Firestore fallback lookup error:', fe);
        }
      }

      const nowMs = Date.now();
      onlineClassrooms = [];
      rawList.forEach(c => {
        let isOnline = false;
        if (c.lastActive) {
          const lastMs = new Date(c.lastActive).getTime();
          const diffMin = (nowMs - lastMs) / (1000 * 60);
          // 시계 오차 허용 (-5분 ~ 30분 이내 활성)
          if (!isNaN(diffMin) && diffMin >= -5 && diffMin <= 30) {
            isOnline = true;
          }
        }

        if (isOnline) {
          if (c.called) {
            calledRooms.add(c.docId);
          } else {
            calledRooms.delete(c.docId);
          }
          const parts = (c.docId || '').split('_');
          const grade = c.grade || (parts.length >= 3 ? parts[2] : '1');
          const classNum = c.classNum || (parts.length >= 4 ? parts[3] : '1');
          const caf = c.cafeteria || (parts.length >= 2 ? parts[1] : '1');
          onlineClassrooms.push({
            docId: c.docId,
            grade: grade,
            classNum: classNum,
            cafeteria: caf,
            nickname: c.nickname || '',
            isOnline: true
          });
        }
      });

      renderCafeteriaChips();
      renderClassrooms();
    }

    // ─── Call Actions ───
    async function sendCall(docId, grade, classNum) {
      calledRooms.add(docId);
      playChime();
      renderClassrooms();
      showToast(`🔔 ${grade}학년 ${classNum}반에 급식 호출 신호를 전송했습니다!`);

      const nowIso = new Date().toISOString();
      const caller = callerName || '급식지도교사';

      // 1. 해당 학급 전자칠판 전용 문서 직접 업데이트 (칠판 MealCallService가 즉시 감지하여 팝업 트리거)
      try {
        const updateMask = 'updateMask.fieldPaths=called&updateMask.fieldPaths=lastCalledAt&updateMask.fieldPaths=calledAt&updateMask.fieldPaths=calledBy&updateMask.fieldPaths=message';
        const url = `${FIRESTORE_BASE}/eat_calls/${encodeURIComponent(docId)}?${updateMask}`;
        await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              called: { booleanValue: true },
              lastCalledAt: { stringValue: nowIso },
              calledAt: { stringValue: nowIso },
              calledBy: { stringValue: caller },
              message: { stringValue: `${grade}학년 ${classNum}반 급식실로 이동하세요` }
            }
          })
        });
      } catch (e) {
        console.error('Direct classroom call error:', e);
      }

      // 2. 학교 공통 브로드캐스트 문서 동기화 (기존 호환성 유지)
      try {
        const url = `${FIRESTORE_BASE}/eat_calls/${encodeURIComponent(schoolCode)}`;
        await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              active: { booleanValue: true },
              cafeteria: { stringValue: String(selectedCafeteria) },
              targetDocId: { stringValue: docId },
              targetClass: { stringValue: `${grade}-${classNum}` },
              callerName: { stringValue: caller },
              timestamp: { timestampValue: nowIso }
            }
          })
        });
      } catch (e) {
        console.error('Call error:', e);
      }
    }

    async function cancelCall(docId) {
      calledRooms.delete(docId);
      renderClassrooms();
      showToast(`호출이 취소되었습니다.`);

      // 1. 해당 학급 전자칠판 전용 문서의 called 해제
      try {
        const updateMask = 'updateMask.fieldPaths=called';
        const url = `${FIRESTORE_BASE}/eat_calls/${encodeURIComponent(docId)}?${updateMask}`;
        await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              called: { booleanValue: false }
            }
          })
        });
      } catch (e) {
        console.error('Cancel classroom call error:', e);
      }

      // 2. 학교 공통 브로드캐스트 문서 해제
      try {
        const url = `${FIRESTORE_BASE}/eat_calls/${encodeURIComponent(schoolCode)}`;
        await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              active: { booleanValue: false },
              targetDocId: { stringValue: '' },
              timestamp: { timestampValue: new Date().toISOString() }
            }
          })
        });
      } catch (e) {
        console.error('Cancel error:', e);
      }
    }

    async function callAllFilteredClassrooms() {
      const filtered = onlineClassrooms.filter(c => {
        if (!c.isOnline) return false;
        if (selectedCafeteria === 'all') return true;
        return String(c.cafeteria) === String(selectedCafeteria);
      });

      if (filtered.length === 0) {
        showToast('호출할 수 있는 온라인 학급이 없습니다.');
        return;
      }

      filtered.forEach(c => calledRooms.add(c.docId));
      playChime();
      renderClassrooms();
      showToast(`📢 총 ${filtered.length}개 학급에 급식실 이동 호출 신호를 발송했습니다!`);

      const nowIso = new Date().toISOString();
      const caller = callerName || '급식지도교사';

      // 1. 각 온라인 학급 문서에 각각 called: true 전송
      await Promise.allSettled(filtered.map(c => {
        const updateMask = 'updateMask.fieldPaths=called&updateMask.fieldPaths=lastCalledAt&updateMask.fieldPaths=calledAt&updateMask.fieldPaths=calledBy&updateMask.fieldPaths=message';
        const url = `${FIRESTORE_BASE}/eat_calls/${encodeURIComponent(c.docId)}?${updateMask}`;
        return fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              called: { booleanValue: true },
              lastCalledAt: { stringValue: nowIso },
              calledAt: { stringValue: nowIso },
              calledBy: { stringValue: caller },
              message: { stringValue: `${c.grade}학년 ${c.classNum}반 급식실로 이동하세요` }
            }
          })
        });
      }));

      // 2. 학교 공통 브로드캐스트 문서 동기화
      try {
        const url = `${FIRESTORE_BASE}/eat_calls/${encodeURIComponent(schoolCode)}`;
        await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              active: { booleanValue: true },
              cafeteria: { stringValue: String(selectedCafeteria) },
              targetClass: { stringValue: 'all' },
              callerName: { stringValue: caller },
              timestamp: { timestampValue: nowIso }
            }
          })
        });
      } catch (e) {
        console.error('All call error:', e);
      }
    }

    // ─── Neis Meal Menu API ───
    async function loadNeisMealMenu() {
      const container = document.getElementById('mealChipsContainer');
      const queryName = schoolName || schoolCode;

      try {
        const schoolUrl = `https://open.neis.go.kr/hub/schoolInfo?KEY=${NEIS_KEY}&Type=json&pIndex=1&pSize=5&SCHUL_NM=${encodeURIComponent(queryName)}`;
        const sRes = await fetch(schoolUrl);
        if (!sRes.ok) throw new Error('Neis school HTTP ' + sRes.status);
        const sData = await sRes.json();
        
        if (!sData.schoolInfo || sData.schoolInfo.length < 2) {
          throw new Error('School not found');
        }
        const row = sData.schoolInfo[1].row[0];
        const officeCode = row.ATPT_OFCDC_SC_CODE;
        const sCode = row.SD_SCHUL_CODE;
        schoolName = row.SCHUL_NM;
        updateHeaderInfo();

        const now = new Date();
        const ymd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
        const mealUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${NEIS_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${officeCode}&SD_SCHUL_CODE=${sCode}&MLSV_YMD=${ymd}&MMEAL_SC_CODE=2`;

        const mRes = await fetch(mealUrl);
        if (!mRes.ok) throw new Error('Neis meal HTTP ' + mRes.status);
        const mData = await mRes.json();

        if (!mData.mealServiceDietInfo || mData.mealServiceDietInfo.length < 2) {
          container.innerHTML = '<div class="meal-dish-chip">오늘 등록된 급식 메뉴가 없습니다.</div>';
          return;
        }

        const mealRow = mData.mealServiceDietInfo[1].row[0];
        let raw = mealRow.DDISH_NM || '';
        raw = raw.replace(/<br\s*\/?>/gi, '\n');
        raw = raw.replace(/\([0-9. \t\n]+\)/g, '');

        const dishes = raw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
        if (dishes.length === 0) {
          container.innerHTML = '<div class="meal-dish-chip">오늘 등록된 급식 메뉴가 없습니다.</div>';
          return;
        }

        container.innerHTML = dishes.map(d => `<div class="meal-dish-chip">${d}</div>`).join('');
      } catch (err) {
        console.warn('Neis meal fallback:', err);
        container.innerHTML = '<div class="meal-dish-chip">오늘 등록된 급식 메뉴가 없습니다.</div>';
      }
    }

    // ─── Toast ───
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // ─── On Page Load: 접속 시 무조건 모달 열기 ───
    updateHeaderInfo();
    renderCafeteriaChips();
    openEntryModal(true); // ★ 무조건 학교 ID, 급식실, 교사명 확인 모달 노출!
    setInterval(fetchData, 10000);
  </script>
</body>
