  <!-- Hot-Swap Service Worker & Version Auto-Updater -->
  <script>
    (async function() {
      async function purgeAllCachesAndSW() {
        try {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (let reg of regs) {
              if (!reg.active || !reg.active.scriptURL.includes('firebase-messaging-sw.js')) {
                await reg.unregister();
              }
            }
          }
        } catch (e) {
          console.warn('[VersionHotSwap] Purge error:', e);
        }
      }

      try {
        const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          const vData = await res.json();
          const currentVersion = (vData.version || '3.0.5') + '.' + (vData.build_number || '0');
          const lastVersion = localStorage.getItem('bst_deployed_version');
          if (lastVersion && lastVersion !== currentVersion) {
            console.log('[VersionHotSwap] New version detected:', currentVersion, '(was:', lastVersion, '). Purging cache & hot-reloading...');
            localStorage.setItem('bst_deployed_version', currentVersion);
            await purgeAllCachesAndSW();
            window.location.reload(true);
            return;
          }
          localStorage.setItem('bst_deployed_version', currentVersion);
        }
      } catch (err) {
        console.log('[VersionHotSwap] Version fetch skipped:', err);
      }

      purgeAllCachesAndSW();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          console.log('[SW] Controller changed, updating view...');
          window.location.reload();
        });
      }
    })();
  </script>

  <script>
    window.triggerNativePasskeyCreate = async function(email, displayName) {
      if (!window.PublicKeyCredential) {
        throw new Error('??釉뚮씪?곗???FIDO2 WebAuthn ?⑥뒪?ㅻ? 吏?먰븯吏 ?딆뒿?덈떎.');
      }
      const challengeBytes = new Uint8Array(32);
      crypto.getRandomValues(challengeBytes);
      const userIdBytes = new TextEncoder().encode(email || 'class@boardest.local');

      const createOptions = {
        publicKey: {
          challenge: challengeBytes,
          rp: {
            name: "BOARDEST",
            id: window.location.hostname
          },
          user: {
            id: userIdBytes,
            name: email || 'class@boardest.local',
            displayName: displayName || '援먯떎 ?꾩옄移좏뙋'
          },
          pubKeyCredParams: [
            { alg: -7, type: "public-key" },  // ES256
            { alg: -257, type: "public-key" } // RS256
          ],
          authenticatorSelection: {
            userVerification: "preferred",
            residentKey: "preferred"
          },
          timeout: 60000,
          attestation: "none"
        }
      };

      const cred = await navigator.credentials.create(createOptions);
      return cred ? true : false;
    };

    window.triggerNativePasskeyGet = async function() {
      if (!window.PublicKeyCredential) {
        throw new Error('??釉뚮씪?곗???FIDO2 WebAuthn ?⑥뒪?ㅻ? 吏?먰븯吏 ?딆뒿?덈떎.');
      }
      const challengeBytes = new Uint8Array(32);
      crypto.getRandomValues(challengeBytes);
      const getOptions = {
        publicKey: {
          challenge: challengeBytes,
          timeout: 60000,
          userVerification: "preferred",
          rpId: window.location.hostname
        }
      };
      try {
        const assertion = await navigator.credentials.get(getOptions);
        if (assertion) {
          let userEmail = '';
          if (assertion.response && assertion.response.userHandle) {
            userEmail = new TextDecoder().decode(assertion.response.userHandle);
          }
          return JSON.stringify({
            id: assertion.id,
            email: userEmail,
            success: true
          });
        }
      } catch (e) {
        console.warn('Native passkey get error:', e);
      }
      return null;
    };
  </script>

  <script>
    (function() {
      const percentEl = document.getElementById('splash-percent-text');
      const fillEl = document.getElementById('splash-progress-fill');
      const logEl = document.getElementById('splash-log-text');
      const splash = document.getElementById('app-splash-screen');

      let currentPercent = 5;
      const stages = [
        { p: 25, log: '[1/5] WebAssembly 肄붿뼱 ?붿쭊 珥덇린??..' },
        { p: 48, log: '[2/5] 釉뚮씪?곗? 罹먯떆 諛?ServiceWorker ?뺥빀??寃利?..' },
        { p: 72, log: '[3/5] Firebase ?ㅼ떆媛??대씪?곕뱶 梨꾨꼸 ?곌껐...' },
        { p: 90, log: '[4/5] ?꾩옄移좏뙋 ?쒓컙??& 湲됱떇 紐⑤뱢 諛붿씤??..' },
        { p: 96, log: '[5/5] UI 而댄룷?뚰듃 ?뚮뜑留?以鍮??꾨즺...' }
      ];

      let stageIdx = 0;
      const timer = setInterval(() => {
        if (stageIdx < stages.length) {
          const target = stages[stageIdx];
          if (currentPercent < target.p) {
            currentPercent += Math.floor(Math.random() * 4) + 2;
            if (currentPercent > target.p) currentPercent = target.p;
          } else {
            stageIdx++;
          }
          if (percentEl) percentEl.textContent = currentPercent + '%';
          if (fillEl) fillEl.style.width = currentPercent + '%';
          if (logEl && target.log) logEl.textContent = target.log;
        }
      }, 120);

      function finishLoading() {
        clearInterval(timer);
        if (percentEl) percentEl.textContent = '100%';
        if (fillEl) fillEl.style.width = '100%';
        if (logEl) logEl.textContent = '以鍮??꾨즺! 援먯떎 ??쒕낫?쒕줈 吏꾩엯?⑸땲??';
        setTimeout(() => {
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 400);
          }
        }, 200);
      }

      const observer = new MutationObserver((mutations) => {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
          observer.disconnect();
          finishLoading();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('flutter-first-frame', finishLoading);
    })();
  </script>
