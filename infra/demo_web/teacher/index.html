  <script>
    (async function() {
      try {
        let hadSw = false;
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let reg of registrations) {
            if (!reg.active || !reg.active.scriptURL.includes('firebase-messaging-sw.js')) {
              await reg.unregister();
              hadSw = true;
            }
          }
        }
        if ('caches' in window) {
          const names = await caches.keys();
          for (let name of names) {
            await caches.delete(name);
          }
        }
        if (hadSw && !sessionStorage.getItem('bst_sw_reloaded_v6')) {
          sessionStorage.setItem('bst_sw_reloaded_v6', 'true');
          window.location.reload();
        }
      } catch (_) {}
    })();

      e.preventDefault();
    });

  <script>
    window.triggerNativePasskeyCreate = async function(email, displayName) {
      if (!window.PublicKeyCredential) {
        throw new Error('??釉뚮씪?곗???FIDO2 WebAuthn ?⑥뒪?ㅻ? 吏?먰븯吏 ?딆뒿?덈떎.');
      }
      const challengeBytes = new Uint8Array(32);
      crypto.getRandomValues(challengeBytes);
      const userIdBytes = new TextEncoder().encode(email || 'teacher@boardest.local');

      const createOptions = {
        publicKey: {
          challenge: challengeBytes,
          rp: {
            name: "BOARDEST",
            id: window.location.hostname
          },
          user: {
            id: userIdBytes,
            name: email || 'teacher@boardest.local',
            displayName: displayName || '?좎깮??
          },
          pubKeyCredParams: [
            { alg: -7, type: "public-key" },  // ES256
            { alg: -257, type: "public-key" } // RS256
          ],
          authenticatorSelection: {
            userVerification: "preferred",
            residentKey: "preferred"
          },
          timeout: 60000,
          attestation: "none"
        }
      };

      const cred = await navigator.credentials.create(createOptions);
      return cred ? true : false;
    };

    window.triggerNativePasskeyGet = async function() {
      if (!window.PublicKeyCredential) {
        throw new Error('??釉뚮씪?곗???FIDO2 WebAuthn ?⑥뒪?ㅻ? 吏?먰븯吏 ?딆뒿?덈떎.');
      }
      const challengeBytes = new Uint8Array(32);
      crypto.getRandomValues(challengeBytes);
      const getOptions = {
        publicKey: {
          challenge: challengeBytes,
          timeout: 60000,
          userVerification: "preferred",
          rpId: window.location.hostname
        }
      };
      try {
        const assertion = await navigator.credentials.get(getOptions);
        if (assertion) {
          let userEmail = '';
          if (assertion.response && assertion.response.userHandle) {
            userEmail = new TextDecoder().decode(assertion.response.userHandle);
          }
          return JSON.stringify({
            id: assertion.id,
            email: userEmail,
            success: true
          });
        }
      } catch (e) {
        console.warn('Native passkey get error:', e);
      }
      return null;
    };

  <script>
    // ??? Pro vs Lite Device Detection & Route Handling ???
    (function() {
      const path = window.location.pathname.toLowerCase();
      const search = window.location.search;
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      
      const isExplicitPro = path.includes('/pro');
      const isExplicitLite = path.includes('/lite');

      if (!isExplicitPro && !isExplicitLite && isMobile && !new URLSearchParams(search).has('desktop')) {
        window.location.replace('/lite/' + search + window.location.hash);
      }
    })();

    // PWA Install Prompt Restriction Policy:

    window.addEventListener('beforeinstallprompt', (e) => {
      const ua = navigator.userAgent.toLowerCase();
      const isAndroid = ua.includes('android');
      const isWindows = ua.includes('windows');
      const isIOS = /iphone|ipad|ipod/.test(ua);
      const isChromeOS = ua.includes('cros');
      const isLinux = ua.includes('linux') && !isAndroid;

        e.preventDefault();
        console.log('[PWA Guard] PWA install prompt blocked on Android/Windows per policy.');

      const splash = document.getElementById('app-splash-screen');

      let currentPercent = 5;
      const stages = [
        { p: 25, log: '[1/5] WebAssembly 肄붿뼱 ?붿쭊 珥덇린??..' },
        { p: 48, log: '[2/5] Google OAuth ?몄뀡 諛?釉뚮씪?곗? 罹먯떆 ?뺤씤...' },

      ];

      let stageIdx = 0;
      const timer = setInterval(() => {
        if (stageIdx < stages.length) {
          const target = stages[stageIdx];
          if (currentPercent < target.p) {
            currentPercent += Math.floor(Math.random() * 4) + 2;
            if (currentPercent > target.p) currentPercent = target.p;
          } else {
            stageIdx++;
          }
          if (percentEl) percentEl.textContent = currentPercent + '%';
          if (fillEl) fillEl.style.width = currentPercent + '%';
          if (logEl && target.log) logEl.textContent = target.log;
        }
      }, 120);

      function finishLoading() {
        clearInterval(timer);
        if (percentEl) percentEl.textContent = '100%';
        if (fillEl) fillEl.style.width = '100%';
        if (logEl) logEl.textContent = '以鍮??꾨즺! 援먯궗???꾧뎄濡?吏꾩엯?⑸땲??';
        setTimeout(() => {
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 400);
          }
        }, 200);
      }

      const observer = new MutationObserver((mutations) => {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
          observer.disconnect();
          finishLoading();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('flutter-first-frame', finishLoading);
    })();
  </script>
