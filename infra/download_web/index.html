<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>404 Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #0D1117;
      color: #94A1B2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

      font-size: 80px;
      color: #FF5470;
      margin: 0 0 12px 0;
      font-weight: 900;
      letter-spacing: -2px;
    }

      font-size: 22px;
      color: #FFFFFF;
      margin: 0 0 12px 0;

    }

      font-size: 15px;
      margin-bottom: 28px;
      max-width: 440px;
      line-height: 1.6;
    }
    a {

      align-items: center;
      padding: 10px 20px;

      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;

      transform: scale(1.04);
