<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden — Boardest</title>
  <link rel="icon" type="image/png" href="https://welcome-to-boardest.web.app/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #14161f;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ef4565;
      --danger-glow: rgba(239, 69, 101, 0.25);
      --accent: #00f5d4;
      --text: #fffffe;
      --text-sub: #94a1b2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .forbidden-container {
      max-width: 520px;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .forbidden-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--danger), #ff8906);
    }

    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: 80px;
      font-weight: 900;
      color: var(--danger);
      line-height: 1;
      margin-bottom: 12px;
      text-shadow: 0 0 30px var(--danger-glow);
    }

    .badge {
      display: inline-block;
      background: rgba(239, 69, 101, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .desc {
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .desc strong {
      color: var(--text);
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f5d4, #2ec4b6);
      color: #0b0c10;
      box-shadow: 0 4px 14px rgba(0, 245, 212, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 245, 212, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="forbidden-container">
    <div class="error-code">403</div>
    <div class="badge">HTTP 403 FORBIDDEN</div>
    <h1 class="title">웹 서비스 접근이 제한되었습니다</h1>
    <p class="desc">
      보안 및 서비스 정책 개편에 따라 본 웹 사이트의 접근이 일시 중단되었습니다.<br>
      전자칠판은 <strong>Boardest Windows 설치 앱</strong> 또는 <strong>Android 앱</strong>을 이용해 주시기 바랍니다.
    </p>
    <div class="btn-wrap">
      <a class="btn btn-primary" href="https://welcome-to-boardest.web.app">
        🚀 Boardest 공식 안내 포털 바로가기
      </a>
      <a class="btn btn-secondary" href="https://welcome-to-boardest.web.app/eat">
        🍱 급식 지도 (Boardest Eat) 바로가기
      </a>
    </div>
  </div>
</body>
</html>
