  <script>
    // ─── Pro vs Lite Device Detection & Route Handling ───
    (function() {
      const path = window.location.pathname.toLowerCase();
      const search = window.location.search;
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      
      const isExplicitPro = path.includes('/pro');
      const isExplicitLite = path.includes('/lite');

      if (!isExplicitPro && !isExplicitLite && isMobile) {
        window.location.replace('/lite/' + search);
      }
    })();

    // PWA Install Prompt Restriction Policy:
    // Block PWA install prompt on Android & Windows; allow ONLY on iOS, ChromeOS, Linux!
    window.addEventListener('beforeinstallprompt', (e) => {
      const ua = navigator.userAgent.toLowerCase();
      const isAndroid = ua.includes('android');
      const isWindows = ua.includes('windows');
      const isIOS = /iphone|ipad|ipod/.test(ua);
      const isChromeOS = ua.includes('cros');
      const isLinux = ua.includes('linux') && !isAndroid;

      if (isAndroid || isWindows) {
        e.preventDefault();
        console.log('[PWA Guard] PWA install prompt blocked on Android/Windows per policy.');
      } else if (isIOS || isChromeOS || isLinux) {
        console.log('[PWA Guard] PWA installation allowed for iOS/ChromeOS/Linux.');
      }
    });

    // auth=success 파라미터가 유입되었을 때 Flutter Web 로딩 전 유실 방지를 위해 즉시 localStorage 백업
    if (window.location.search && window.location.search.includes('auth=success')) {
      try {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const email = params.get('email') || '';
        const teacherName = params.get('teacherName') || '';
        const teacherId = params.get('teacherId') || '';
        const schoolId = params.get('schoolId') || 'ydm';
        const schoolCode = params.get('schoolCode') || params.get('schoolId') || '44134';
        const schoolName = params.get('schoolName') || '양동중학교';
        const grade = params.get('grade') || '1';
        const classNum = params.get('classNum') || '1';
        const isHomeroom = params.get('isHomeroom') || 'true';
        const cafeteria = params.get('cafeteriaNum') || '1';
        const totpSecret = params.get('totpSecret') || '';

        localStorage.setItem('boardest_auth_callback_search', window.location.search);
        if (totpSecret) {
          localStorage.setItem('flutter.bst_totp_secret_key', totpSecret);
          localStorage.setItem('flutter.bst_totp_secret', totpSecret);
          localStorage.setItem('boardest_totp_secret', totpSecret);
        }
        if (token) {
          localStorage.setItem('flutter.bst_google_access_token', token);
          localStorage.setItem('flutter.bst_token', token);
          localStorage.setItem('boardest_google_access_token', token);
        }
        if (email) {
          localStorage.setItem('flutter.bst_google_user_email', email);
          localStorage.setItem('flutter.bst_user_email', email);
          localStorage.setItem('boardest_user_email', email);
        }
        if (teacherName) {
          localStorage.setItem('flutter.bst_google_user_name', teacherName);
          localStorage.setItem('flutter.bst_user_name', teacherName);
        }
        if (schoolName) {
          localStorage.setItem('flutter.bst_school_name', schoolName);
        }
      } catch (e) {
        console.warn('Backup auth query error:', e);
      }
    }

  </script>
