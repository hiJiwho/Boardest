    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let reg of registrations) {
          if (!reg.active || !reg.active.scriptURL.includes('firebase-messaging-sw.js')) {
            reg.unregister();
          }
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>

  <script>
    // ─── Pro vs Lite Device Detection & Route Handling ───
    (function() {
      const path = window.location.pathname.toLowerCase();
      const search = window.location.search;
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      
      const isExplicitPro = path.includes('/pro');
      const isExplicitLite = path.includes('/lite');

      if (!isExplicitPro && !isExplicitLite && isMobile) {
        window.location.replace('/lite/' + search);
      }
    })();

    // PWA Install Prompt Restriction Policy:
    // Block PWA install prompt on Android & Windows; allow ONLY on iOS, ChromeOS, Linux!
    window.addEventListener('beforeinstallprompt', (e) => {
      const ua = navigator.userAgent.toLowerCase();
      const isAndroid = ua.includes('android');
      const isWindows = ua.includes('windows');
      const isIOS = /iphone|ipad|ipod/.test(ua);
      const isChromeOS = ua.includes('cros');
      const isLinux = ua.includes('linux') && !isAndroid;

      if (isAndroid || isWindows) {
        e.preventDefault();
        console.log('[PWA Guard] PWA install prompt blocked on Android/Windows per policy.');
      } else if (isIOS || isChromeOS || isLinux) {
        console.log('[PWA Guard] PWA installation allowed for iOS/ChromeOS/Linux.');
      }
    });

    // auth=success 파라미터가 유입되었을 때 Flutter Web 로딩 전 유실 방지를 위해 즉시 localStorage 백업
    if (window.location.search && window.location.search.includes('auth=success')) {
      try {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const email = params.get('email') || '';
        const teacherName = params.get('teacherName') || '';
        const teacherId = params.get('teacherId') || '';
        const schoolId = params.get('schoolId') || 'ydm';
        const schoolCode = params.get('schoolCode') || params.get('schoolId') || '44134';
        const schoolName = params.get('schoolName') || '양동중학교';
        const grade = params.get('grade') || '1';
        const classNum = params.get('classNum') || '1';
        const isHomeroom = params.get('isHomeroom') || 'true';
        const cafeteria = params.get('cafeteriaNum') || '1';
        const totpSecret = params.get('totpSecret') || '';

        localStorage.setItem('boardest_auth_callback_search', window.location.search);
        if (totpSecret) {
          localStorage.setItem('flutter.bst_totp_secret_key', totpSecret);
          localStorage.setItem('flutter.bst_totp_secret', totpSecret);
          localStorage.setItem('boardest_totp_secret', totpSecret);
        }
        if (token) {
          localStorage.setItem('flutter.bst_google_access_token', token);
          localStorage.setItem('flutter.bst_token', token);
          localStorage.setItem('boardest_google_access_token', token);
        }
        if (email) {
          localStorage.setItem('flutter.bst_google_user_email', email);
          localStorage.setItem('flutter.bst_user_email', email);
          localStorage.setItem('boardest_user_email', email);
        }
        if (teacherName) {
          localStorage.setItem('flutter.bst_google_user_name', teacherName);
          localStorage.setItem('flutter.bst_user_name', teacherName);
        }
        if (schoolName) {
          localStorage.setItem('flutter.bst_school_name', schoolName);
        }
      } catch (e) {
        console.warn('Backup auth query error:', e);
      }
    }

  </script>

  </div>

  <script>
    (function() {
      const percentEl = document.getElementById('splash-percent-text');
      const fillEl = document.getElementById('splash-progress-fill');
      const logEl = document.getElementById('splash-log-text');
      const splash = document.getElementById('app-splash-screen');

      let currentPercent = 5;
      const stages = [
        { p: 25, log: '[1/5] WebAssembly 코어 엔진 초기화...' },
        { p: 48, log: '[2/5] Google OAuth 세션 및 브라우저 캐시 확인...' },
        { p: 72, log: '[3/5] Firebase Firestore & RTDB 채널 연결...' },
        { p: 90, log: '[4/5] 시간표 & 급식 동기화 엔진 바인딩...' },
        { p: 96, log: '[5/5] 교사용 UI 컨트롤러 렌더링 준비 완료...' }
      ];

      let stageIdx = 0;
      const timer = setInterval(() => {
        if (stageIdx < stages.length) {
          const target = stages[stageIdx];
          if (currentPercent < target.p) {
            currentPercent += Math.floor(Math.random() * 4) + 2;
            if (currentPercent > target.p) currentPercent = target.p;
          } else {
            stageIdx++;
          }
          if (percentEl) percentEl.textContent = currentPercent + '%';
          if (fillEl) fillEl.style.width = currentPercent + '%';
          if (logEl && target.log) logEl.textContent = target.log;
        }
      }, 120);

      function finishLoading() {
        clearInterval(timer);
        if (percentEl) percentEl.textContent = '100%';
        if (fillEl) fillEl.style.width = '100%';
        if (logEl) logEl.textContent = '준비 완료! 교사용 도구로 진입합니다.';
        setTimeout(() => {
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 400);
          }
        }, 200);
      }

      const observer = new MutationObserver((mutations) => {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
          observer.disconnect();
          finishLoading();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('flutter-first-frame', finishLoading);
    })();
  </script>
