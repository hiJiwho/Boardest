<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="boardest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>boardest</title>
  <link rel="manifest" href="manifest.json">
  <!-- Firebase Compat App & Messaging SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBMoJZHMBN4eYJtiZR2iGePcmIB7bg8wGo",
      authDomain: "jiwhosboardest.firebaseapp.com",
      projectId: "jiwhosboardest",
      storageBucket: "jiwhosboardest.appspot.com",
      messagingSenderId: "287519871774",
      appId: "1:287519871774:web:d259c730cb85b001a1c34a"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    let fcmMessaging = null;
    try {
      if (firebase.messaging.isSupported()) {
        fcmMessaging = firebase.messaging();
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('firebase-messaging-sw.js').catch((err) => {
            console.log('[FCM SW] ServiceWorker registration warning: ', err);
          });
        }
      }
    } catch(e) {
      console.log('FCM not supported: ', e);
    }

    window.bst = {
      ver: function() { return "Boardest B 2.7.2 (Antigravity Engine)"; },
      getFcmToken: async function() {
        if (!fcmMessaging) return null;
        try {
          const permission = await Notification.requestPermission();
          if (permission === 'granted') {
            const token = await fcmMessaging.getToken();
            return token;
          }
        } catch(e) {
          console.log('Error getting FCM token: ', e);
        }
        return null;
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
