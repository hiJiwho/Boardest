<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="boardest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>boardest</title>
  <link rel="manifest" href="manifest.json">
  <!-- Firebase Compat App & Messaging SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBMoJZHMBN4eYJtiZR2iGePcmIB7bg8wGo",
      authDomain: "jiwhosboardest.firebaseapp.com",
      projectId: "jiwhosboardest",
      storageBucket: "jiwhosboardest.appspot.com",
      messagingSenderId: "287519871774",
      appId: "1:287519871774:web:d259c730cb85b001a1c34a"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    let fcmMessaging = null;
    try {
      if (firebase.messaging.isSupported()) {
        fcmMessaging = firebase.messaging();
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('firebase-messaging-sw.js').catch((err) => {
            console.log('[FCM SW] ServiceWorker registration warning: ', err);
          });
        }
      }
    } catch(e) {
      console.log('FCM not supported: ', e);
    }

    window.bst = {
      ver: function() { return "Boardest B 2.7.2 (Antigravity Engine)"; },
      getFcmToken: async function() {
        if (!fcmMessaging) return null;
        try {
          const permission = await Notification.requestPermission();
          if (permission === 'granted') {
            const token = await fcmMessaging.getToken();
            return token;
          }
        } catch(e) {
          console.log('Error getting FCM token: ', e);
        }
        return null;
      }
    };
  </script>
  <style>
    body {
      background-color: #0D1117;
      margin: 0;
      padding: 0;
    }
    #app-splash-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #0D1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.4s ease;
    }
    .splash-logo-img {
      width: 80px; height: 80px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 245, 212, 0.25);
      animation: splash-pulse 1.8s infinite ease-in-out;
    }
    .splash-brand-text {
      margin-top: 20px;
      font-size: 24px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .splash-brand-sub {
      margin-top: 4px;
      font-size: 13.5px;
      color: #00F5D4;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .splash-progress-track {
      width: 180px; height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 22px;
      position: relative;
    }
    .splash-progress-fill {
      width: 100%; height: 100%;
      background: linear-gradient(90deg, #00F5D4, #7F5AF0);
      animation: splash-bar-anim 1.4s infinite ease-in-out;
      transform-origin: 0% 50%;
    }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes splash-bar-anim {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div id="app-splash-screen">
    <img src="favicon.png" alt="Boardest" class="splash-logo-img">
    <div class="splash-brand-text">Boardest</div>
    <div class="splash-brand-sub">스마트 교실 로딩 중...</div>
    <div class="splash-progress-track">
      <div class="splash-progress-fill"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
