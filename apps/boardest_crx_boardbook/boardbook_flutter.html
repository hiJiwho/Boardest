<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boardest BoardBook (Flutter Engine)</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F0F12;
      color: #FFFFFE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #flutter_host {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F0E17;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(0, 245, 212, 0.2);
      border-top-color: #00F5D4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
      color: #00F5D4;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Boardest Class Flutter 뷰어 엔진 로딩 중...</div>
  </div>

  <iframe id="flutter_host" allow="camera; microphone; display-capture; autoplay; clipboard-write"></iframe>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const session = params.get('session') || '';
      const loading = document.getElementById('loading');
      const iframe = document.getElementById('flutter_host');

      // 1. 로컬 Flutter 번들이 CRX 내에 존재하는지 확인
      let targetUrl = 'flutter/index.html?session=' + encodeURIComponent(session);
      try {
        const res = await fetch(chrome.runtime.getURL('flutter/index.html'), { method: 'HEAD' });
        if (!res.ok) {
          // 로컬 번들이 없는 경우 온라인 Boardest Class 웹앱의 Flutter 뷰어로 연동
          targetUrl = 'https://boardest-class.web.app/?session=' + encodeURIComponent(session) + '&tool=tbp_viewer';
        } else {
          targetUrl = chrome.runtime.getURL(targetUrl);
        }
      } catch (_) {
        targetUrl = 'https://boardest-class.web.app/?session=' + encodeURIComponent(session) + '&tool=tbp_viewer';
      }

      iframe.src = targetUrl;
      iframe.onload = () => {
        setTimeout(() => {
          loading.style.opacity = '0';
          setTimeout(() => loading.style.display = 'none', 300);
        }, 500);
      };
    })();
  </script>
</body>
</html>
