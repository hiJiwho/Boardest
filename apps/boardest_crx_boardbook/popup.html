<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Boardest BoardBook</title>
  <style>
    body {
      width: 260px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #16161A;
      color: #FFFFFE;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #00F5D4;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 12px;
      color: #94A1B2;
      line-height: 1.5;
      margin: 0 0 12px 0;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      background: rgba(0, 245, 212, 0.15);
      color: #00F5D4;
      border: 1px solid rgba(0, 245, 212, 0.3);
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 0;
      text-align: center;
      background: #7F5AF0;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #6e44ec;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFE;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
  </style>
</head>

  <h3>📖 Boardest BoardBook</h3>
  <span class="badge">v5.0.13 (Flutter Engine)</span>
